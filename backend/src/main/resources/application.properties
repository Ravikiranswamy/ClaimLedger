# Server Configuration
server.port=${PORT:8080}

# =====================================================
# DATABASE — Neon PostgreSQL (ClaimLedger Cloud DB)
# =====================================================
spring.datasource.url=jdbc:postgresql://ep-nameless-scene-aogybz86-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_SJ8qm0CPrNyu
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate — use 'none' since schema is already live in Neon
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — DISABLED (schema created directly in Neon; Flyway conflicts with native PG ENUMs)
spring.flyway.enabled=false

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
claimledger.upload.dir=${UPLOAD_DIR:uploads/documents}

# JWT Security
claimledger.jwt.secret=ClaimLedgerSuperSecretKey2026ForBrandGovernanceVerySecureKeyWith256BitsMin
claimledger.jwt.expiration-ms=86400000

# =====================================================
# GEMINI API — Google AI Studio (set via GEMINI_API_KEY env)
# =====================================================
google.gemini.api-key=${GEMINI_API_KEY:}
google.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Spring AI (kept for embedding generation)
spring.ai.openai.api-key=UNUSED

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS — allow frontend dev server
claimledger.cors.allowed-origins=http://localhost:5173,http://localhost:3000
